<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Contact - AST</title>
<style>
/* ===== GLOBAL ===== */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #050b18;
    color: #eaf4ff;
}
header {
    text-align: center;
    padding: 40px 20px;
}
h1 {
    color: #ffd166;
    font-size: 2.5em;
    text-shadow: 0 0 10px #ffd166;
}

/* ===== FORMULAIRE ===== */
form {
    max-width: 500px;
    margin: 20px auto;
    background: rgba(10, 20, 50, 0.8);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(58, 134, 255, 0.5);
}
label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}
input, textarea {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border-radius: 12px;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 1em;
}
textarea {
    resize: vertical;
}
button {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    background: linear-gradient(135deg, #3a86ff, #00b4d8);
    color: #000;
    font-weight: bold;
    border-radius: 20px;
    cursor: pointer;
    font-size: 1.1em;
    transition: 0.3s;
}
button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(58, 134, 255, 0.8);
}

/* ===== INFOS DE CONTACT ===== */
.contact-info {
    text-align: center;
    margin-top: 30px;
    font-size: 1.1em;
}
.contact-info a {
    color: #3a86ff;
    text-decoration: none;
    font-weight: bold;
}
.contact-info p {
    margin: 5px 0;
}
top-link {
    padding: 15px;
}
.top-link a {
    color: #3a86ff;
    text-decoration: none;
    font-weight: bold;
}


</style>
</head>
<body>
<div class="top-link">
    <a href="Index.html">← Page d’accueil</a>
</div>
<header>
    <h1>📬 Contact AST</h1>
    <p>Envoyez-moi un message ou utilisez les informations ci-dessous pour me contacter directement.</p>
</header>

<form>
    <label for="name">Nom :</label>
    <input type="text" id="name" name="name" placeholder="Votre nom" required>

    <label for="email">Email :</label>
    <input type="email" id="email" name="email" placeholder="Votre email" required>

    <label for="message">Message :</label>
    <textarea id="message" name="message" rows="6" placeholder="Votre message" required></textarea>

    <button type="submit">Envoyer</button>
</form>

<div class="contact-info">
    <p>Email : <a href="mailto:saraahdid65@gmail.com">saraahdid65@gmail.com</a></p>
    <p>Téléphone : <a href="tel:0639376967">0639376967</a></p>
</div>

</body>
</html>
